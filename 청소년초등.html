<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디지털새싹 사전 설문조사 - 제주시청소년수련관 방과후아카데미</title>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f7fa;
      margin: 0;
      padding: 24px 16px;
      color: #333;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 24px;
    }
    .info-box {
      background-color: #e8f3ff;
      border: 1px solid #bfe0ff;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #0056b3;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .card {
      background: #fafafa;
      border: 1.5px solid #eaeaea;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card:hover {
      border-color: #007aff;
      background-color: #f0f7ff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.12);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .student-num {
      font-size: 0.8rem;
      color: #888;
      font-weight: 500;
    }
    .student-grade {
      font-size: 0.8rem;
      background: #eee;
      padding: 2px 6px;
      border-radius: 4px;
      color: #555;
    }
    .student-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #222;
      margin: 4px 0;
    }
    .student-code {
      font-size: 0.95rem;
      color: #007aff;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .copy-hint {
      font-size: 0.75rem;
      color: #999;
      text-align: right;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>디지털새싹 초등학생 사전 설문조사</h1>
  <div class="subtitle">소속: 제주시청소년수련관 방과후아카데미</div>

  <div class="info-box">
    👉 본인 이름을 클릭하면 <strong>학생코드가 복사</strong>되며 설문조사 페이지로 이동합니다.<br>
    설문지에 코드를 입력하는 칸에 <strong>붙여넣기(Ctrl + V 또는 꾹 눌러 붙여넣기)</strong>를 해주세요.
  </div>

  <div class="grid" id="studentGrid"></div>
</div>

<div class="toast" id="toast">학생코드가 복사되었습니다. 설문창으로 이동합니다!</div>

<script>
  const SURVEY_URL = "https://form.kosac.re.kr/v/I0u6x1TYKMyKEDHYjrQj";

  const students = [
    { num: 1, name: "이*린", grade: "3학년 4반", code: "175373" },
    { num: 2, name: "장*민", grade: "3학년 2반", code: "318396" },
    { num: 3, name: "송*림", grade: "4학년 2반", code: "186788" },
    { num: 4, name: "문*현", grade: "4학년 2반", code: "299202" },
    { num: 5, name: "이*아", grade: "4학년 2반", code: "453303" },
    { num: 6, name: "한*호", grade: "5학년 3반", code: "131984" },
    { num: 7, name: "백*우", grade: "5학년 2반", code: "964267" },
    { num: 8, name: "고*준", grade: "6학년 1반", code: "580805" },
    { num: 9, name: "문*린", grade: "6학년 1반", code: "376540" },
    { num: 10, name: "장*인", grade: "6학년 2반", code: "762795" },
    { num: 11, name: "신*진", grade: "6학년 5반", code: "513821" },
    { num: 12, name: "조*윤", grade: "5학년 1반", code: "478328" },
    { num: 13, name: "장*서", grade: "5학년 1반", code: "993822" },
    { num: 14, name: "오*현", grade: "6학년 1반", code: "277970" }
  ];

  const grid = document.getElementById("studentGrid");
  const toast = document.getElementById("toast");

  students.forEach(student => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <span class="student-num">번호: ${student.num}</span>
        <span class="student-grade">${student.grade}</span>
      </div>
      <div class="student-name">${student.name}</div>
      <div class="student-code">코드: ${student.code}</div>
      <div class="copy-hint">클릭 시 코드 복사 & 이동</div>
    `;

    card.addEventListener("click", () => {
      navigator.clipboard.writeText(student.code).then(() => {
        showToast();
        setTimeout(() => {
          window.open(SURVEY_URL, "_blank");
        }, 600);
      }).catch(() => {
        window.open(SURVEY_URL, "_blank");
      });
    });

    grid.appendChild(card);
  });

  function showToast() {
    toast.style.display = "block";
    setTimeout(() => {
      toast.style.display = "none";
    }, 1500);
  }
</script>

</body>
</html>
