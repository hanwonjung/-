<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서귀포여중 디싹 설문 참여</title>
<style>
:root{--blue:#225da8;--deep:#163e70;--bg:#f2f6fc;--text:#1d2939;--muted:#667085;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 44px}.hero{padding:28px 24px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--deep),#4788d5);box-shadow:0 12px 28px #173b6620}.tag{font-size:13px;opacity:.85;font-weight:700}h1{font-size:clamp(25px,5vw,34px);line-height:1.25;margin:9px 0}.hero p{color:#eaf3ff;line-height:1.6;margin:0}.go{display:block;margin-top:20px;background:white;color:var(--deep);text-align:center;text-decoration:none;padding:15px;border-radius:13px;font-weight:850;font-size:17px}.card{background:white;margin-top:20px;padding:21px;border-radius:19px;box-shadow:0 5px 18px #173b660b}h2{font-size:20px;margin:0 0 8px}.hint{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 15px}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;margin-bottom:13px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.name{font-weight:750}.num{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}.code{font:800 19px ui-monospace,monospace;letter-spacing:.06em;margin-top:4px}.btn{border:0;border-radius:10px;padding:10px 11px;background:#e9f1ff;color:#2057a2;font-weight:800;cursor:pointer;white-space:nowrap}.status{min-height:22px;color:#16794b;font-size:14px;font-weight:700;margin:12px 0 0}.missing{font-size:12px;color:#7b5e00;background:#fff8db;padding:11px 13px;border-radius:11px;margin-top:15px;line-height:1.5}.foot{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 0}@media(max-width:470px){.list{grid-template-columns:1fr}.hero{padding:23px 19px}.card{padding:17px 14px}}
</style></head><body><main>
<header class="hero"><div class="tag">서귀포여자중학교 · 디싹 설문</div><h1>1~28번 이름을 찾아<br>참여 코드를 복사하세요</h1><p>내 이름과 번호를 확인하고 코드를 복사한 뒤 설문에 붙여 넣으세요.</p><a class="go" href="https://newsac.kosac.re.kr/public/survey" target="_blank" rel="noopener">디싹 설문 열기 ↗</a></header>
<section class="card"><h2>내 참여 코드</h2><p class="hint">이름이나 번호로 찾아 <b>코드 복사</b>를 누르세요. 설문 사이트에서 코드를 붙여 넣으면 됩니다.</p><input id="search" class="search" type="search" placeholder="이름 또는 번호 검색"><div class="list" id="list"></div><p class="status" id="status" aria-live="polite"></p><p class="missing">첨부 자료에 표시된 이름과 참여 코드를 확인해 사용하세요.</p></section><p class="foot">이름은 첨부 자료에 표시된 마스킹 형태로 제공됩니다.</p>
</main><script>
const students=[
['1','가*서','3030EQ'],['2','강*주','BTZQ4I'],['3','강*희','C3UM1M'],['4','고*운','0KYD97'],['5','김**림','E9CT48'],['6','김*은','5WDH3'],['7','김*채','26ST99'],['8','김*연','HZRC7H'],
['9','김*리','OZWW7J'],['10','김*서','Y7ALEL'],['11','김*형','TAF9VC'],['12','문*원','8C1SGB'],['13','송*은','EXX85X'],['14','양*현','PHPO8I'],['15','양*은','ZVXB1E'],['16','오*주','7P9EDN'],['17','오*은','652TK8'],['18','이*인','6P8YRA'],
['19','이*빈','K8Q9RO'],['20','이*이','XA53TW'],['21','이*솔','6SS2YT'],['22','이*아','O2RWWR'],['23','이*영','5CLXWC'],['24','정*은','5RF5G9'],['25','조*아','ANNZ9T'],['26','허*민','T4TY2W'],['27','현*희','D7YPPP'],['28','김*빈','P39IBF']];
const list=document.querySelector('#list'),status=document.querySelector('#status');function render(q=''){list.innerHTML='';students.filter(([n,name])=>!q||n.includes(q)||name.includes(q)).forEach(([n,name,code])=>{const row=document.createElement('article');row.className='row';row.innerHTML=`<div><span class="num">${n}번</span><span class="name">${name}</span><div class="code">${code}</div></div><button class="btn" type="button">코드 복사</button>`;row.querySelector('button').onclick=async()=>{try{await navigator.clipboard.writeText(code);status.textContent=`${name} ${n}번 코드 ${code}를 복사했어요.`}catch{status.textContent=`코드 ${code}를 선택해 복사해 주세요.`}};list.append(row)});if(!list.children.length)list.innerHTML='<p>해당 이름이나 번호를 찾지 못했어요.</p>'}document.querySelector('#search').addEventListener('input',e=>{status.textContent='';render(e.target.value.trim())});render();
</script></body></html>
